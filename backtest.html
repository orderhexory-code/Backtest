const chart = LightweightCharts.createChart(
    document.getElementById("chart"),
    {
        layout: {
            background: { color: "#111821" },
            textColor: "#d1d9e0"
        },
        grid: {
            vertLines: { color: "#1d2733" },
            horzLines: { color: "#1d2733" }
        },
        timeScale: {
            timeVisible: true,
            secondsVisible: false
        }
    }
);

const series = chart.addCandlestickSeries();

series.setData(candles);

for (const trade of trades) {

    const color =
        trade.side === "LONG"
            ? "#22c55e"
            : "#ef4444";

    series.setMarkers([
        {
            time: trade.entryTime,
            position:
                trade.side === "LONG"
                    ? "belowBar"
                    : "aboveBar",
            color: color,
            shape:
                trade.side === "LONG"
                    ? "arrowUp"
                    : "arrowDown",
            text:
                trade.side + " " +
                trade.result
        }
    ]);

}

chart.timeScale().fitContent();


const tbody =
    document.getElementById("trades");


for (const trade of trades) {

    const tr =
        document.createElement("tr");

    tr.innerHTML = `
        <td>${trade.side}</td>
        <td>${new Date(trade.entryTime * 1000).toISOString()}</td>
        <td>${new Date(trade.exitTime * 1000).toISOString()}</td>
        <td>${trade.entry.toFixed(3)}</td>
        <td>${trade.exit.toFixed(3)}</td>
        <td>${trade.result}</td>
        <td>${trade.r.toFixed(2)}R</td>
        <td>$${trade.pnl.toFixed(2)}</td>
    `;

    tbody.appendChild(tr);

}
