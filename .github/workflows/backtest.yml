name: US100 Pullback Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Find input CSV
        run: |
          echo "CSV files found:"
          find data -type f -name "*.csv" -print

      - name: Run backtest
        run: |
          CSV_FILE=$(find data -type f -name "*.csv" | head -n 1)

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: No CSV file found."
            exit 1
          fi

          echo "Using CSV:"
          echo "$CSV_FILE"

          python scripts/backtest.py \
            "$CSV_FILE" \
            --output backtest.html

      - name: Verify HTML
        run: |
          if [ ! -f backtest.html ]; then
            echo "ERROR: backtest.html was not created."
            exit 1
          fi

          echo "HTML created successfully:"
          ls -lh backtest.html

      - name: Commit HTML dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backtest.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "backtest: generate US100 pullback dashboard"
            git push
          fi
