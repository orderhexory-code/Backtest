name: US100 Pullback Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Find real CSV
        shell: bash
        run: |
          echo "All CSV files:"
          find data -type f -name "*.csv" -print

          CSV_FILE=$(find data -type f -name "*.csv" \
            ! -name "YOUR-1-DAY-CSV.csv" \
            | head -n 1)

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: No real CSV file found."
            exit 1
          fi

          echo ""
          echo "Using CSV:"
          echo "$CSV_FILE"

          echo ""
          echo "CSV header:"
          head -n 2 "$CSV_FILE"

          echo "CSV_FILE=$CSV_FILE" >> "$GITHUB_ENV"

      - name: Run backtest
        run: |
          python scripts/backtest.py \
            "$CSV_FILE" \
            --output backtest.html

      - name: Verify HTML
        run: |
          test -s backtest.html

          echo "Backtest dashboard created:"
          ls -lh backtest.html

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backtest.html

          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "backtest: generate US100 pullback dashboard"
            git push
          fi
