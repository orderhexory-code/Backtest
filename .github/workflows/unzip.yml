name: Unzip and Flatten Upload
on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Recursively extract every zip (including nested zips) and flatten
        run: |
          set -e
          shopt -s nullglob

          extract_one() {
            local zip="$1"
            local destdir
            destdir="$(dirname "$zip")"
            echo "=== Extracting $zip into $destdir ==="

            local tmpdir
            tmpdir="$(mktemp -d)"
            unzip -q "$zip" -d "$tmpdir"

            local entries=("$tmpdir"/*)

            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              # Single wrapper folder -> pull its CONTENTS into destdir, discard wrapper
              echo "Single wrapper folder detected: $(basename "${entries[0]}") -> flattening into $destdir"
              cp -a "${entries[0]}/." "$destdir/"
            else
              # Multiple top-level entries -> copy as-is into destdir
              cp -a "$tmpdir/." "$destdir/"
            fi

            rm -rf "$tmpdir"
            rm -f "$zip"
            echo "=== Done with $zip ==="
          }

          round=1
          while true; do
            # Find ALL zip files anywhere in the repo (root + any nested folder),
            # excluding .git directory
            mapfile -t zips < <(find . -path ./.git -prune -o -type f -iname "*.zip" -print)

            if [ ${#zips[@]} -eq 0 ]; then
              echo "No more .zip files found (round $round) - extraction complete."
              break
            fi

            echo "--- Round $round: found ${#zips[@]} zip(s) ---"
            for zip in "${zips[@]}"; do
              extract_one "$zip"
            done

            round=$((round + 1))

            # Safety valve to avoid infinite loop in weird edge cases
            if [ "$round" -gt 20 ]; then
              echo "Too many extraction rounds, stopping to avoid infinite loop."
              break
            fi
          done

      - name: Commit extracted files back to repo
        env:
          PUSH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "extract-bot"
          git config user.email "extract-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed - skipping commit."
          else
            git commit -m "Auto-extract and flatten uploaded zip(s), including nested [skip ci]"
            git push
          fi
